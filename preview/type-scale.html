<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Type scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 8px 0; vertical-align: baseline; }
  .sample {
    font-family: var(--os-font);
    color: var(--os-primary-dark);
  }
  .meta {
    font-family: var(--os-font);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(33,25,65,0.55);
    text-align: right;
    white-space: nowrap;
    padding-left: 20px;
  }
</style>
</head>
<body>
  <div class="card is-vertical">
    <table>
      <tr><td class="sample" style="font-size:34px;font-weight:700;line-height:1.1">Display 1</td><td class="meta">96 / 700</td></tr>
      <tr><td class="sample" style="font-size:26px;font-weight:700;line-height:1.2">Headline H1</td><td class="meta">64 / 700</td></tr>
      <tr><td class="sample" style="font-size:20px;font-weight:700;line-height:1.3">Section H2</td><td class="meta">48 / 700</td></tr>
      <tr><td class="sample" style="font-size:16px;font-weight:700">Card H4</td><td class="meta">32 / 700</td></tr>
      <tr><td class="sample" style="font-size:14px;font-weight:400">Body Regular</td><td class="meta">30 / 400</td></tr>
      <tr><td class="sample" style="font-size:13px;font-weight:300">Body Light — usado em parágrafos longos.</td><td class="meta">30 / 300</td></tr>
      <tr><td class="sample" style="font-size:11px;font-weight:400;letter-spacing:0.08em;text-transform:uppercase">Tag · Uppercase</td><td class="meta">20 / 400</td></tr>
    </table>
  </div>
</body>
</html>
