<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Slide header chrome</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; background: #E6EDFF; overflow: hidden; height: 200px; position: relative; }
  .card::before {
    content: ""; position: absolute; inset: -30% -10% auto auto;
    width: 320px; height: 320px; border-radius: 50%;
    background: #fff; filter: blur(40px); opacity: 0.7;
  }
  .header {
    position: relative; z-index: 1;
    padding: 22px 28px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pill {
    display: inline-flex; padding: 8px 16px; border-radius: 12px;
    background: rgba(1,50,165,0.10); color: #0132A5;
    font-family: var(--os-font); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    box-shadow: 0 4px 8px rgba(0,0,0,0.20);
  }
  .body {
    position: relative; z-index: 1;
    padding: 8px 28px 22px;
    font-family: var(--os-font);
    color: var(--os-primary-dark);
  }
  .h1 { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .tag {
    font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase;
    color: rgba(33,25,65,0.55); margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div class="header">
      <div class="pill">Cores</div>
      <div class="pill">Brand Guidelines</div>
    </div>
    <div class="body">
      <div class="h1">Cores da marca.</div>
      <div class="tag">Slide chrome · 176 px header band, 64 px gutters</div>
    </div>
  </div>
</body>
</html>
