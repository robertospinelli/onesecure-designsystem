<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .row { gap: 0; align-items: flex-end; }
  .bar {
    background: #0132A5;
    border-radius: 4px;
    margin-right: 12px;
    position: relative;
  }
  .bar::after {
    content: attr(data-px);
    position: absolute;
    bottom: -18px; left: 0;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: rgba(33,25,65,0.65);
    width: 100%; text-align: center;
  }
  .bar::before {
    content: attr(data-tok);
    position: absolute;
    top: -16px; left: 0;
    font-family: var(--os-font);
    font-size: 9px; color: rgba(33,25,65,0.5);
    text-transform: uppercase; letter-spacing: 0.08em;
    width: 100%; text-align: center;
  }
</style>
</head>
<body>
  <div class="card is-vertical" style="padding-top:38px;padding-bottom:38px">
    <div class="row">
      <div class="bar" data-tok="s-1" data-px="4"  style="width:4px;height:60px"></div>
      <div class="bar" data-tok="s-2" data-px="8"  style="width:8px;height:60px"></div>
      <div class="bar" data-tok="s-3" data-px="12" style="width:12px;height:60px"></div>
      <div class="bar" data-tok="s-4" data-px="16" style="width:16px;height:60px"></div>
      <div class="bar" data-tok="s-5" data-px="24" style="width:24px;height:60px"></div>
      <div class="bar" data-tok="s-6" data-px="32" style="width:32px;height:60px"></div>
      <div class="bar" data-tok="s-7" data-px="48" style="width:48px;height:60px"></div>
      <div class="bar" data-tok="s-8" data-px="64" style="width:64px;height:60px"></div>
      <div class="bar" data-tok="s-9" data-px="96" style="width:96px;height:60px"></div>
    </div>
  </div>
</body>
</html>
