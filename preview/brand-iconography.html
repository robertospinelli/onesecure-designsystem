<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Iconography</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
  .tile {
    aspect-ratio: 4/3; border-radius: 16px;
    background: #EAF0FF;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--os-font);
    color: var(--os-primary-dark);
  }
  .tile img { width: 36px; height: 36px; }
  .tile .n {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75;
  }
  .note {
    font-family: var(--os-font); font-size: 11px; font-style: italic;
    color: rgba(33,25,65,0.55); padding: 0 4px;
  }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div class="grid">
      <div class="tile">
        <img src="../assets/icons/check.svg" alt="check">
        <div class="n">Check</div>
      </div>
      <div class="tile">
        <img src="../assets/icons/verified-user.svg" alt="verified user">
        <div class="n">Shield</div>
      </div>
      <div class="tile">
        <img src="../assets/icons/exclamation.svg" alt="exclamation">
        <div class="n">Exclamation</div>
      </div>
    </div>
    <div class="note">No native icon system. Substitute Material Symbols (Rounded, weight 300) and flag.</div>
  </div>
</body>
</html>
