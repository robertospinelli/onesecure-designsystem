<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Chart · Barras</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; background: #fff; }
  .ml { font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(33,25,65,0.55); margin-bottom: 4px; }
  .mv { font-size: 22px; font-weight: 700; color: #211941; line-height: 1; margin-bottom: 14px; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(33,25,65,0.5); margin-top: 8px; padding: 0 26px; }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div class="ml">ARR · projeção parceiro</div>
    <div class="mv">R$ 1,8 M <span style="font-size:11px;font-weight:500;color:#0132A5;background:rgba(50,128,239,0.14);padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle">Y5</span></div>
    <svg viewBox="0 0 480 200" width="100%" height="180" preserveAspectRatio="xMidYMid meet">
      <line x1="0" x2="480" y1="65"  y2="65"  stroke="rgba(33,25,65,0.06)" stroke-dasharray="3 4"/>
      <line x1="0" x2="480" y1="115" y2="115" stroke="rgba(33,25,65,0.06)" stroke-dasharray="3 4"/>
      <line x1="0" x2="480" y1="170" y2="170" stroke="rgba(33,25,65,0.10)"/>
      <!-- 5 bars across 480 wide -->
      <rect x="30"  y="155.4" width="60" height="14.6" rx="8" fill="#A9C3FF"/>
      <rect x="120" y="131.4" width="60" height="38.6" rx="8" fill="#3280EF"/>
      <rect x="210" y="98.4"  width="60" height="71.6" rx="8" fill="#3280EF"/>
      <rect x="300" y="60.0"  width="60" height="110"  rx="8" fill="#3280EF"/>
      <rect x="390" y="20.0"  width="60" height="150"  rx="8" fill="#0132A5"/>
      <text x="60"  y="150" text-anchor="middle" font-family="Lexend, sans-serif" font-size="11" font-weight="500" fill="#211941">180k</text>
      <text x="150" y="126" text-anchor="middle" font-family="Lexend, sans-serif" font-size="11" font-weight="500" fill="#211941">420k</text>
      <text x="240" y="93"  text-anchor="middle" font-family="Lexend, sans-serif" font-size="11" font-weight="500" fill="#211941">780k</text>
      <text x="330" y="55"  text-anchor="middle" font-family="Lexend, sans-serif" font-size="11" font-weight="500" fill="#211941">1,2M</text>
      <text x="420" y="14"  text-anchor="middle" font-family="Lexend, sans-serif" font-size="12" font-weight="700" fill="#0132A5">1,8M</text>
    </svg>
    <div class="axis"><span>Y1</span><span>Y2</span><span>Y3</span><span>Y4</span><span>Y5</span></div>
  </div>
</body>
</html>
