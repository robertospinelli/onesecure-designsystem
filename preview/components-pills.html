<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Tags & CTAs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 16px; }
  .row { gap: 12px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(1, 50, 165, 0.10);
    color: #0132A5;
    font-family: var(--os-font);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .pill.dark { background: #0132A5; color: #fff; }
  .pill.ghost { background: #fff; box-shadow: inset 0 0 0 1px rgba(33,25,65,0.10); color: #211941; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .group-label {
    font-family: var(--os-font);
    font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase;
    color: rgba(33,25,65,0.5); margin-bottom: 6px;
  }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div>
      <div class="group-label">Page chips · header</div>
      <div class="row">
        <span class="pill">Cores</span>
        <span class="pill">Tipografia</span>
        <span class="pill">Introdução</span>
        <span class="pill">Brand Guidelines</span>
      </div>
    </div>
    <div>
      <div class="group-label">CTA buttons</div>
      <div class="row">
        <span class="pill dark">Call to action</span>
        <span class="pill ghost">Saiba mais</span>
        <span class="pill dark"><span class="dot" style="background:#BDFCE3;opacity:1"></span>Em operação</span>
      </div>
    </div>
  </div>
</body>
</html>
