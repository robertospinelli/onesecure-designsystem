<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Principle pair</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 24px; background: #fff; gap: 14px; }
  .row { gap: 14px; align-items: flex-start; }
  .check {
    width: 22px; height: 22px; border-radius: 999px;
    background: #0132A5;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .check svg { width: 12px; height: 12px; }
  .h {
    font-family: var(--os-font); font-weight: 700; font-size: 16px;
    color: var(--os-primary-dark); line-height: 1.3;
  }
  .b {
    font-family: var(--os-font); font-weight: 300; font-size: 13px;
    color: rgba(33,25,65,0.7); line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div class="row">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>
      </div>
      <div>
        <div class="h">Segurança como sistema.</div>
        <div class="b">Segurança não é evento. É operação.</div>
      </div>
    </div>
    <div class="row">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>
      </div>
      <div>
        <div class="h">Integração real.</div>
        <div class="b">Ferramentas isoladas não resolvem. Conectamos, organizamos e damos contexto.</div>
      </div>
    </div>
  </div>
</body>
</html>
