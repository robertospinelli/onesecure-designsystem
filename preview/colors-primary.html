<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ONESecure — Primary palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 24px; }
  .swatch {
    flex: 1;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
    color: #fff;
    box-shadow: 0 4px 12px rgba(33,25,65,0.08);
  }
  .swatch .h { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; font-weight: 400; }
  .swatch .hex { font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
</style>
</head>
<body>
  <div class="card is-vertical">
    <div class="grid">
      <div class="swatch" style="background:#0132A5">
        <div class="h">Primary</div>
        <div class="hex">#0132A5</div>
      </div>
      <div class="swatch" style="background:#211941">
        <div class="h">Primary&nbsp;Dark</div>
        <div class="hex">#211941</div>
      </div>
      <div class="swatch" style="background:#3280EF">
        <div class="h">Primary&nbsp;Bright</div>
        <div class="hex">#3280EF</div>
      </div>
      <div class="swatch" style="background:#E6EDFF; color:#211941; box-shadow: inset 0 0 0 1px rgba(33,25,65,0.08)">
        <div class="h">Page&nbsp;BG</div>
        <div class="hex">#E6EDFF</div>
      </div>
    </div>
  </div>
</body>
</html>
